<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>スマホ将棋 Ver.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;background:#f4efe5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}body{min-height:100vh;padding:12px 10px 28px}.app{max-width:620px;margin:auto}h1{font-size:22px;text-align:center;margin:4px 0 10px}.topbar,.bottom-actions{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap}.pill,.btn,.level-btn{border:1px solid #b8aa91;background:#fffaf0;border-radius:10px;min-height:42px;padding:8px 12px}.btn,.level-btn{font-weight:700}.level-btn.active{background:#333;color:#fff;border-color:#333}.status{text-align:center;min-height:25px;font-weight:700;margin:8px 0}.hand{min-height:58px;background:#fffaf0;border:1px solid #c7b99e;border-radius:10px;padding:7px;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}.hand-label{font-size:12px;color:#776c5b;margin-right:3px}.hand-piece{min-width:42px;height:40px;border:1px solid #b9a98d;border-radius:8px;background:#eee3cb;font-size:22px;font-weight:700;cursor:pointer;position:relative}.hand-piece.selected{outline:3px solid #555}.count{font-size:11px;position:absolute;right:3px;bottom:0}.board-wrap{display:flex;justify-content:center;margin:9px 0}#board{width:min(92vw,540px);height:min(92vw,540px);display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);background:#d8b56c;border:3px solid #8c6b35;border-radius:3px;touch-action:manipulation;overflow:hidden}.cell{position:relative;display:flex;align-items:center;justify-content:center;border-right:1px solid #8c6b35;border-bottom:1px solid #8c6b35;background:#e0bd73;font-size:clamp(25px,7.6vw,43px);line-height:1;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;user-select:none}.cell:nth-child(9n){border-right:0}.cell:nth-last-child(-n+9){border-bottom:0}.cell.selected{background:#f0d48e}.cell.target:after{content:"";width:22%;height:22%;border-radius:50%;background:#6b5b42;opacity:.72;position:absolute}.cell.capture:after{content:"";width:48%;height:48%;border-radius:50%;border:4px solid #6b5b42;opacity:.72;position:absolute}.piece.gote{transform:rotate(180deg)}.help{font-size:12px;line-height:1.55;color:#655d50;text-align:center;margin:8px auto 12px;max-width:540px}.danger{color:#9b2020}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-card{background:#fffaf0;border-radius:14px;padding:18px;max-width:330px;width:100%;box-shadow:0 10px 35px rgba(0,0,0,.25);text-align:center}.modal-card h2{font-size:18px;margin:0 0 14px}.modal-row{display:flex;gap:10px;justify-content:center}.modal-row button{flex:1;min-height:46px;border:1px solid #b8aa91;border-radius:10px;background:#eee3cb;font-weight:700}.footer{text-align:center;color:#857967;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<h1>スマホ将棋 Ver.1</h1>
<div class="topbar"><span class="pill">CPU：<span id="levelText">中級</span></span><button class="level-btn" data-level="1">初級</button><button class="level-btn active" data-level="2">中級</button><button class="level-btn" data-level="3">上級</button><button class="btn" id="newGame">新しい対局</button><button class="btn" id="undo">待った</button></div>
<div class="status" id="status">あなたの手番です</div>
<div class="hand" id="cpuHand"></div>
<div class="board-wrap"><div id="board" aria-label="将棋盤"></div></div>
<div class="hand" id="playerHand"></div>
<div class="help">盤上の自分の駒をタップ → 行き先をタップ。<br>持ち駒は駒をタップしてから、打つ場所をタップ。成れる場合は確認が出ます。</div>
<div class="footer">単体HTML・外部ライブラリ不使用 / iPhone Safari向け</div>
</div>
<div class="modal hidden" id="promotionModal"><div class="modal-card"><h2>成りますか？</h2><div class="modal-row"><button id="promoteYes">成る</button><button id="promoteNo">成らない</button></div></div></div>
<script>
(function(){
'use strict';
var P={FU:'歩',KY:'香',KE:'桂',GI:'銀',KI:'金',KA:'角',HI:'飛',OU:'玉',TO:'と',NY:'杏',NK:'圭',NG:'全',UM:'馬',RY:'龍'};
var VALUES={FU:100,KY:300,KE:350,GI:450,KI:550,KA:850,HI:1000,OU:100000,TO:550,NY:600,NK:600,NG:600,UM:1100,RY:1300};
var board=[],hands={},turn='sente',selected=null,selectedDrop=null,history=[],gameOver=false,cpuLevel=2,cpuTimer=null,pendingPromotion=null;
function empty(){var b=[],r,c;for(r=0;r<9;r++){b[r]=[];for(c=0;c<9;c++)b[r][c]=null}return b}
function pc(t,s,pr){return{type:t,side:s,promoted:!!pr}}
function reset(){board=empty();var top=['KY','KE','GI','KI','OU','KI','GI','KE','KY'];var c;for(c=0;c<9;c++){board[0][c]=pc(top[c],'gote');board[8][c]=pc(top[c],'sente');board[2][c]=pc('FU','gote');board[6][c]=pc('FU','sente')}board[1][1]=pc('KA','gote');board[1][7]=pc('HI','gote');board[7][1]=pc('HI','sente');board[7][7]=pc('KA','sente');hands={sente:{FU:0,KY:0,KE:0,GI:0,KI:0,KA:0,HI:0},gote:{FU:0,KY:0,KE:0,GI:0,KI:0,KA:0,HI:0}};turn='sente';selected=null;selectedDrop=null;history=[];gameOver=false;if(cpuTimer){clearTimeout(cpuTimer);cpuTimer=null}setStatus('あなたの手番です');render()}
function clone(){return{board:board.map(function(row){return row.map(function(p){return p?{type:p.type,side:p.side,promoted:p.promoted}:null})}),hands:{sente:Object.assign({},hands.sente),gote:Object.assign({},hands.gote)},turn:turn,gameOver:gameOver}}
function restore(s){board=s.board.map(function(row){return row.map(function(p){return p?{type:p.type,side:p.side,promoted:p.promoted}:null})});hands={sente:Object.assign({},s.hands.sente),gote:Object.assign({},s.hands.gote)};turn=s.turn;gameOver=s.gameOver;selected=null;selectedDrop=null;render()}
function setStatus(t,d){var e=document.getElementById('status');e.textContent=t;e.className='status'+(d?' danger':'')}
function inside(r,c){return r>=0&&r<9&&c>=0&&c<9}function enemy(s){return s==='sente'?'gote':'sente'}function fwd(s){return s==='sente'?-1:1}
function promoType(t){return{FU:'TO',KY:'NY',KE:'NK',GI:'NG',KA:'UM',HI:'RY'}[t]||t}function baseType(t){return{TO:'FU',NY:'KY',NK:'KE',NG:'GI',UM:'KA',RY:'HI'}[t]||t}
function canPromo(p,a,b){if(p.promoted||!['FU','KY','KE','GI','KA','HI'].includes(p.type))return false;return p.side==='sente'?(a<=2||b<=2):(a>=6||b>=6)}
function mustPromo(p,r){if(p.promoted)return false;if(p.type==='FU'||p.type==='KY')return p.side==='sente'?r===0:r===8;if(p.type==='KE')return p.side==='sente'?r<=1:r>=7;return false}
function text(p){return P[p.promoted?promoType(p.type):p.type]}
function raw(r,c){var p=board[r][c],o=[];if(!p)return o;var f=fwd(p.side),nr,nc,i;function add(a,b){if(inside(a,b)&&(!board[a][b]||board[a][b].side!==p.side))o.push({r:a,c:b})}function slide(dr,dc){i=0;while(true){i++;nr=r+dr*i;nc=c+dc*i;if(!inside(nr,nc))break;if(!board[nr][nc])o.push({r:nr,c:nc});else{if(board[nr][nc].side!==p.side)o.push({r:nr,c:nc});break}}}
var t=p.promoted?promoType(p.type):p.type;if(t==='OU'){for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc)}else if(t==='FU')add(r+f,c);else if(t==='KY')slide(f,0);else if(t==='KE'){add(r+2*f,c-1);add(r+2*f,c+1)}else if(t==='GI'){add(r+f,c-1);add(r+f,c);add(r+f,c+1);add(r-f,c-1);add(r-f,c+1)}else if(['KI','TO','NY','NK','NG'].includes(t)){add(r+f,c-1);add(r+f,c);add(r+f,c+1);add(r,c-1);add(r,c+1);add(r-f,c)}else if(t==='KA'){slide(-1,-1);slide(-1,1);slide(1,-1);slide(1,1)}else if(t==='HI'){slide(-1,0);slide(1,0);slide(0,-1);slide(0,1)}else if(t==='UM'){slide(-1,-1);slide(-1,1);slide(1,-1);slide(1,1);add(r-1,c);add(r+1,c);add(r,c-1);add(r,c+1)}else if(t==='RY'){slide(-1,0);slide(1,0);slide(0,-1);slide(0,1);add(r-1,c-1);add(r-1,c+1);add(r+1,c-1);add(r+1,c+1)}return o}
function king(s){for(var r=0;r<9;r++)for(var c=0;c<9;c++)if(board[r][c]&&board[r][c].side===s&&board[r][c].type==='OU')return{r:r,c:c};return null}
function attacked(r,c,s){for(var rr=0;rr<9;rr++)for(var cc=0;cc<9;cc++){var p=board[rr][cc];if(!p||p.side!==s)continue;var m=raw(rr,cc);for(var i=0;i<m.length;i++)if(m[i].r===r&&m[i].c===c)return true}return false}
function check(s){var k=king(s);return !k||attacked(k.r,k.c,enemy(s))}
function apply(m){if(m.drop){board[m.tr][m.tc]=pc(m.drop,m.side,false);hands[m.side][m.drop]--;return}var p=board[m.fr][m.fc],cap=board[m.tr][m.tc];if(cap&&cap.type!=='OU')hands[m.side][baseType(cap.type)]++;board[m.tr][m.tc]=p;board[m.fr][m.fc]=null;if(m.promote)p.promoted=true}
function undoRaw(m,cap,old){if(m.drop){board[m.tr][m.tc]=null;hands[m.side][m.drop]++}else{var p=board[m.tr][m.tc];if(cap&&cap.type!=='OU')hands[m.side][baseType(cap.type)]--;p.promoted=old;board[m.fr][m.fc]=p;board[m.tr][m.tc]=cap}}
function legal(m){var p=m.drop?null:board[m.fr][m.fc],cap=m.drop?null:board[m.tr][m.tc],old=p?p.promoted:false;apply(m);var ok=!check(m.side);undoRaw(m,cap,old);return ok}
function dropOK(t,s,r,c){if(hands[s][t]<=0||board[r][c])return false;if((t==='FU'||t==='KY')&&(s==='sente'?r===0:r===8))return false;if(t==='KE'&&(s==='sente'?r<=1:r>=7))return false;if(t==='FU'){for(var rr=0;rr<9;rr++)if(board[rr][c]&&board[rr][c].side===s&&board[rr][c].type==='FU'&&!board[rr][c].promoted)return false;var dm={drop:'FU',side:s,tr:r,tc:c};apply(dm);var mate=check(enemy(s))&&legalMoves(enemy(s)).length===0;undoRaw(dm,null,false);if(mate)return false}return true}
function legalMoves(s){var out=[],r,c,i,j,p,m,opts;for(r=0;r<9;r++)for(c=0;c<9;c++){p=board[r][c];if(!p||p.side!==s)continue;m=raw(r,c);for(i=0;i<m.length;i++){var tr=m[i].r,tc=m[i].c;opts=mustPromo(p,tr)?[true]:(canPromo(p,r,tr)?[false,true]:[false]);for(j=0;j<opts.length;j++){var mv={fr:r,fc:c,tr:tr,tc:tc,side:s,promote:opts[j]};if(legal(mv))out.push(mv)}}}var types=['FU','KY','KE','GI','KI','KA','HI'];for(i=0;i<types.length;i++)if(hands[s][types[i]]>0)for(r=0;r<9;r++)for(c=0;c<9;c++)if(dropOK(types[i],s,r,c)){var dm={drop:types[i],side:s,tr:r,tc:c};if(legal(dm))out.push(dm)}return out}
function renderHands(){var specs=[['gote','cpuHand','CPUの持ち駒'],['sente','playerHand','あなたの持ち駒']];specs.forEach(function(x){var side=x[0],el=document.getElementById(x[1]);el.innerHTML='<span class="hand-label">'+x[2]+'</span>';['HI','KA','KI','GI','KE','KY','FU'].forEach(function(t){if(hands[side][t]>0){var b=document.createElement('button');b.className='hand-piece'+(selectedDrop&&selectedDrop.type===t&&selectedDrop.side===side?' selected':'');b.textContent=P[t];var q=document.createElement('span');q.className='count';q.textContent=hands[side][t];b.appendChild(q);if(side==='sente'&&!gameOver&&turn==='sente'){b.onclick=function(){selected=null;selectedDrop={type:t,side:'sente'};render()}}el.appendChild(b)}})})}
function render(){var el=document.getElementById('board');el.innerHTML='';var targets=[];if(selected){var p=board[selected.r][selected.c];targets=raw(selected.r,selected.c).filter(function(q){var opts=mustPromo(p,q.r)?[true]:(canPromo(p,selected.r,q.r)?[false,true]:[false]);return opts.some(function(pr){return legal({fr:selected.r,fc:selected.c,tr:q.r,tc:q.c,side:'sente',promote:pr})})})}else if(selectedDrop){for(var r=0;r<9;r++)for(var c=0;c<9;c++)if(dropOK(selectedDrop.type,'sente',r,c))targets.push({r:r,c:c})}for(var rr=0;rr<9;rr++)for(var cc=0;cc<9;cc++){var cell=document.createElement('button');cell.type='button';cell.className='cell';if(selected&&selected.r===rr&&selected.c===cc)cell.classList.add('selected');var t=targets.some(function(q){return q.r===rr&&q.c===cc});if(t)cell.classList.add(board[rr][cc]?'capture':'target');var p2=board[rr][cc];if(p2){var sp=document.createElement('span');sp.className='piece '+p2.side+(p2.promoted?' promoted':'');sp.textContent=text(p2);cell.appendChild(sp)}(function(r,c){cell.onclick=function(){tap(r,c)}})(rr,cc);el.appendChild(cell)}renderHands()}
function tap(r,c){if(gameOver||turn!=='sente')return;var p=board[r][c];if(selectedDrop){if(dropOK(selectedDrop.type,'sente',r,c)){history.push(clone());apply({drop:selectedDrop.type,side:'sente',tr:r,tc:c});selectedDrop=null;afterHuman()}else setStatus('そこには打てません');return}if(selected){if(p&&p.side==='sente'){selected={r:r,c:c};render();return}var src=board[selected.r][selected.c];var reachable=raw(selected.r,selected.c).some(function(q){return q.r===r&&q.c===c});if(!reachable){selected=null;render();return}if(mustPromo(src,r)){humanMove(true,r,c);return}if(canPromo(src,selected.r,r)){pendingPromotion={fr:selected.r,fc:selected.c,tr:r,tc:c};document.getElementById('promotionModal').classList.remove('hidden');return}humanMove(false,r,c)}else if(p&&p.side==='sente'){selected={r:r,c:c};selectedDrop=null;render()}}
function humanMove(pr,tr,tc){var q=pendingPromotion;if(q){pendingPromotion=null;document.getElementById('promotionModal').classList.add('hidden')}else q={fr:selected.r,fc:selected.c,tr:tr,tc:tc};var mv={fr:q.fr,fc:q.fc,tr:q.tr,tc:q.tc,side:'sente',promote:!!pr};if(!legal(mv)){selected=null;render();setStatus('その手は指せません');return}history.push(clone());apply(mv);selected=null;selectedDrop=null;afterHuman()}
function afterHuman(){turn='gote';render();var ms=legalMoves('gote');if(!ms.length){gameOver=true;setStatus(check('gote')?'あなたの勝ち！':'対局終了');render();return}setStatus('CPUが考えています…');cpuTimer=setTimeout(cpuMove,300)}
function moveScore(m){var s=Math.random()*3,p=m.drop?null:board[m.fr][m.fc],cap=board[m.tr][m.tc];if(cap)s+=VALUES[cap.type]*1.3;if(m.promote&&p)s+=VALUES[p.type]*.35;if(m.drop)s+=VALUES[m.drop]*.15;s+=(4-Math.abs(4-m.tc))*2;return s}
function cpuMove(){cpuTimer=null;if(gameOver)return;var ms=legalMoves('gote');if(!ms.length){gameOver=true;setStatus('あなたの勝ち！');return}var scored=ms.map(function(m){return{m:m,s:moveScore(m)}}).sort(function(a,b){return b.s-a.s});var mv;if(cpuLevel===1)mv=ms[Math.floor(Math.random()*ms.length)];else if(cpuLevel===2)mv=scored[Math.floor(Math.random()*Math.min(10,scored.length))].m;else{var top=scored.slice(0,Math.min(8,scored.length)),best=top[0],bestVal=-Infinity;for(var i=0;i<top.length;i++){var m=top[i].m,cap=board[m.tr][m.tc],old=cap?{type:cap.type,side:cap.side,promoted:cap.promoted}:null,p= m.drop?null:board[m.fr][m.fc],oldPr=p?p.promoted:false;apply(m);var replies=legalMoves('sente'),danger=0;for(var j=0;j<Math.min(25,replies.length);j++)danger=Math.max(danger,moveScore(replies[j]));var val=top[i].s-danger*.65;undoRaw(m,old,oldPr);if(val>bestVal){bestVal=val;best=m}}mv=best}apply(mv);turn='sente';render();var hm=legalMoves('sente');if(!hm.length){gameOver=true;setStatus(check('sente')?'CPUの勝ち':'対局終了');render();return}setStatus(check('sente')?'王手されています':'あなたの手番です',check('sente'))}
document.getElementById('promoteYes').onclick=function(){var q=pendingPromotion;if(q)humanMove(true,q.tr,q.tc)};document.getElementById('promoteNo').onclick=function(){var q=pendingPromotion;if(q)humanMove(false,q.tr,q.tc)};document.getElementById('newGame').onclick=reset;document.getElementById('undo').onclick=function(){if(cpuTimer){clearTimeout(cpuTimer);cpuTimer=null}if(history.length){restore(history.pop());setStatus('あなたの手番です')}else setStatus('まだ戻せる手がありません')};document.querySelectorAll('.level-btn').forEach(function(b){b.onclick=function(){cpuLevel=parseInt(b.getAttribute('data-level'),10);document.getElementById('levelText').textContent=['','初級','中級','上級'][cpuLevel];document.querySelectorAll('.level-btn').forEach(function(x){x.classList.remove('active')});b.classList.add('active')}});reset();
})();
</script>
</body>
</html>
